tagline: Aspiring AI/ML Engineer and Safety-Concious Developer
bio: >
  I'm an incoming Master of Engineering student at Cornell University, focusing on Artificial Intelligence and Machine Learning.
  I've graduated from the University of Maryland, College Park, with a Bachelor's degree in Computer Science, and a minor in both Statistics and Astronomy.
  I'm passionate about building projects that leverage AI/ML to solve real-world problems, and I'm particularly interested in the intersection of AI and safety.
